
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="View ingredients and instructions for a recipe on Meal Finder.">
	<title>Recipe Details | Meal Finder</title>
	<link rel="stylesheet" href="css/recipe.css">
	<script type="module" src="js/recipe.mjs"></script>
</head>
<body>
	<a class="skip-link" href="#main-content">Skip to main content</a>

	<header class="site-header">
		<div class="container site-header__inner">
			<a class="site-brand" href="index.html">Meal Finder</a>

			<nav class="primary-nav" aria-label="Main navigation">
				<a class="nav-link" href="index.html">Home</a>

				<details class="nav-dropdown">
					<summary class="nav-link">Recipes</summary>
					<div class="dropdown-menu">
						<a href="index.html">Find Recipes</a>
						<a href="saved.html">Saved Recipes</a>
						<a href="add-recipe.html">Add a Recipe</a>
					</div>
				</details>

				<a class="nav-link" href="shopping-list.html">Shopping List</a>
			</nav>
		</div>
	</header>

	<main id="main-content" class="site-main">
		<div class="container recipe-page">
			<p id="recipe-status" role="status" aria-live="polite">Loading recipe...</p>
			<article id="recipe-details" hidden>
				<header class="recipe-header">
					<div>
						<h1 id="recipe-title"></h1>
						<p id="recipe-meta" class="recipe-meta"></p>
						<button type="button" id="save-recipe-button" class="save-recipe-button">Save recipe</button>
						<p id="save-recipe-status" role="status" aria-live="polite"></p>
					</div>
					<img id="recipe-image" class="recipe-image" alt="" hidden>
				</header>

				<div class="recipe-content">
					<section aria-labelledby="ingredients-heading">
						<h2 id="ingredients-heading">Ingredients</h2>
						<ul id="recipe-ingredients" class="ingredient-list"></ul>
					</section>

					<section aria-labelledby="instructions-heading">
						<h2 id="instructions-heading">Instructions</h2>
						<div id="recipe-instructions" class="instructions"></div>
					</section>
				</div>
			</article>
		</div>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>Meal Finder &middot; WDD 231 Team Project</p>
		</div>
	</footer>
</body>
</html>
